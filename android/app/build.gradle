plugins { id 'com.android.application' }

android {
    namespace 'io.github.mogeldev.unfold'
    compileSdk 37
    defaultConfig {
        applicationId 'io.github.mogeldev.unfold'
        minSdk 24
        // shortcut: 34 keeps the system bars outside the WebView; 35+ draws edge to edge and needs inset handling first
        targetSdk 34
        ndk { abiFilters 'arm64-v8a', 'x86_64' } // phones and the emulator; mpv is ~25 MB per ABI
        versionCode 1
        versionName '0.3.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDirs = ['../../web'] // the same frontend as the desktop app, no copy
}

dependencies {
    implementation project(':mpvkt') // mpvkt-rolling: player, its controls and settings
    implementation libs.mediasession // supertype of the player's service, which MainActivity binds
}
