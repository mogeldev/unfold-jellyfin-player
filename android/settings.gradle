pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement {
    repositories { google(); mavenCentral(); maven { url 'https://www.jitpack.io' } }
    // the player's versions come from the fork, so both builds stay on the same plugins and libraries
    versionCatalogs { libs { from(files('mpvkt/gradle/libs.versions.toml')) } }
}
rootProject.name = 'Unfold'
include ':app'
// The player: the library module of the mpvkt-rolling fork (git submodule android/mpvkt)
include ':mpvkt'
project(':mpvkt').projectDir = file('mpvkt/player')
